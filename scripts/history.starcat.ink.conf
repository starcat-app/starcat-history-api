# Starcat History API 公开服务 Nginx 配置
# 域名: history.starcat.ink
# 证书路径: /etc/nginx/encrypt/starcat/（*.starcat.ink 通配符证书，由 NAS update_certs.sh 上传）
# 上游: 127.0.0.1:5014（starcat-history-api systemd 服务，仅监听回环）

server {
    # 监听 HTTP 并重定向到 HTTPS
    listen 80;
    server_name history.starcat.ink;

    # HTTP 明文入口只做跳转，不暴露正文内容。
    add_header X-Content-Type-Options "nosniff" always;
    return 301 https://history.starcat.ink$request_uri;
}

server {
    listen 443 ssl http2;
    server_name history.starcat.ink;

    # SSL 配置（与 starcat.ink 主站共用同一张通配符证书）
    ssl_certificate /etc/nginx/encrypt/starcat/fullchain.pem;
    ssl_certificate_key /etc/nginx/encrypt/starcat/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:history_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 基础安全响应头；不启 HSTS preload，与主站策略保持一致。
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 缓存策略由 Go 服务唯一决定（handler 里的 embedCacheControl），这里不要再用
    # add_header 追加 Cache-Control：add_header 是追加而非覆盖，会同时出现两条
    # Cache-Control 和两个 max-age，缓存实现取第一个/最后一个/最小值的行为不一致。
    # 另外代理层一旦兜底缓存，4xx 错误响应也会一起被缓存，反而放大故障。

    # SVG 是纯文本，压缩后约为原体积的 1/3 到 1/4（实测 55KB → 16KB），而 README
    # 卡片是按浏览量的第三方流量，带宽直接体现在别人的首屏时间上。
    # gzip_vary 必须开：压缩表示与原表示共用同一个强 ETag，需要 Vary 让缓存按
    # Accept-Encoding 分开存储（nginx 压缩时还会自动把 ETag 改写成 W/ 弱校验，
    # 服务端的 If-None-Match 比较已兼容这种前缀）。
    # gzip_proxied any：到本机的请求是反向代理进来的，默认值 off 会跳过压缩。
    gzip on;
    gzip_types image/svg+xml application/json;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_vary on;

    location / {
        proxy_pass http://127.0.0.1:5014;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # 上游是本机 Go 服务，短暂超时通常是 GitHub API 慢，放宽到 30s。
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # A release is created only after a maintainer explicitly pushes a version tag.
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
